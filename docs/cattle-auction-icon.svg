<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>cattle-auction</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16408a"/>
      <stop offset="0.5" stop-color="#0d2a62"/>
      <stop offset="1" stop-color="#081a40"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7f5"/>
      <stop offset="1" stop-color="#2a9df4"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile-clip">
      <rect x="64" y="64" width="896" height="896" rx="200"/>
    </clipPath>
  </defs>

  <!-- Tile: the same rounded slab, lit from above, as the sibling apps. -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="380" fill="url(#sheen)" clip-path="url(#tile-clip)"/>
  <rect x="68" y="68" width="888" height="888" rx="196" fill="none" stroke="#5aa0ff" stroke-opacity="0.35" stroke-width="8"/>

  <!-- Steer: horns rising from the crown, ears out to the sides, and a face
       that narrows before flaring into the muzzle. -->
  <path d="M430 372 C320 372 252 316 252 206 M594 372 C704 372 772 316 772 206"
        fill="none" stroke="url(#glyph)" stroke-width="64" stroke-linecap="round"/>
  <path d="M338 452 Q268 506 196 446 Q262 404 338 426 Z M686 452 Q756 506 828 446 Q762 404 686 426 Z"
        fill="url(#glyph)" stroke="url(#glyph)" stroke-width="20" stroke-linejoin="round"/>
  <path d="M404 372 H620 Q690 372 682 440 L650 640 Q644 684 664 722 Q684 808 592 808 H432 Q340 808 360 722 Q380 684 374 640 L342 440 Q334 372 404 372 Z"
        fill="none" stroke="url(#glyph)" stroke-width="64" stroke-linejoin="round"/>

  <!-- Inside: extracted lot rows; the warm one is the sold lot's hammer price. -->
  <rect x="424" y="480" width="176" height="56" rx="28" fill="#bdf6ff" fill-opacity="0.9"/>
  <ellipse cx="490" cy="616" rx="136" ry="80" fill="url(#halo)"/>
  <rect x="424" y="588" width="132" height="56" rx="28" fill="#ff8a2a"/>
</svg>
