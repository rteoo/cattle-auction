[project]
name = "cattle-auction"
version = "2.1.0"
description = "Extract lot data from Brazilian cattle auction videos"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default]>=2026.10.26",
    "openai>=3.52.0",
    "groq>=1.7.0",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "click>=8.5.1",
    "python-dotenv>=1.2.4",
    # RapidOCR already installs opencv-python. Both OpenCV wheels export cv2.
    "rapidocr-onnxruntime>=1.4.4",
]

[project.optional-dependencies]
# Apple Silicon only — install with: uv sync --extra local
local = ["mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "models"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
prompts = "prompts"

[tool.hatch.build.targets.sdist]
exclude = ["/.claude", "/.clawpatch"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
