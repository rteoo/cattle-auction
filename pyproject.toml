[project]
name = "cattle-auction"
version = "1.2.3"
description = "Extract lot data from Brazilian cattle auction videos"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.0.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "groq>=0.11.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "rapidocr-onnxruntime>=1.4.4",
    "opencv-python-headless>=4.5",
]

[project.optional-dependencies]
# Apple Silicon only — install with: uv sync --extra local
local = ["mlx-whisper>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "models"]

[tool.uv]
# rapidocr-onnxruntime depends on opencv-python, but opencv-python-headless
# is a compatible drop-in that avoids GUI lib conflicts on macOS.
# This override tells uv to satisfy opencv-python requirements with
# opencv-python-headless instead.
constraint-dependencies = [
    "opencv-python-headless>=4.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
